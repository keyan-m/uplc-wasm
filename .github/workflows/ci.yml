name: Rust

on:
  push:
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Rust project - latest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
    steps:
      - name: Install WASM native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang llvm jq
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.15.0"
      - uses: actions/checkout@v4
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: |
            pkg-node
            pkg-web
