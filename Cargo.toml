[package]
name = "uplc-wasm"
version = "0.3.1"
edition = "2021"
description = "A WebAssembly (wasm) wrapper for the uplc crate"
repository = "https://github.com/keyan-m/uplc-wasm"
license = "Apache-2.0"
keywords = ["cardano", "wasm", "uplc"]
categories = ["algorithms"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# uplc = { version = "1.1.15" }
uplc = { git = "https://github.com/aiken-lang/aiken.git", rev = "353f281e77e26503797445f32bad312d45c4727d" }
# uplc = { version = "1.1.15", path = "../../aiken-lang/aiken/crates/uplc" }

wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
# required for wasm usage of getrandom
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Oz']
